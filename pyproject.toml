[project]
name = "stratification"
version = "0.1.0"
description = "Series of ML projects whose knowledge builds off one another to form the core of deep learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bedrock",
    "convection",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "ruff",
    "pre-commit",
    "nbstripout",
    "torch>=2.15.0",
]

[tool.uv.workspace]
members = ["packages/*", "projects/*"]

[tool.uv.sources]
mineral = { workspace = true }
bedrock = { workspace = true }
convection = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","I","B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["packages"]
